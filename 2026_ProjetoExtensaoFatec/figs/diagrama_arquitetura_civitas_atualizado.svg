]]></style><marker id="arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0,0 L 10,5 L 0,10 Z" fill="#2E414A" /></marker></defs><rect fill="#FFFFFF" height="1110" width="1400" x="0" y="0" /><rect fill="#E5F2F3" height="252" rx="9" ry="9" stroke="#34444D" stroke-width="2.25" width="1272" x="64" y="20" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="86" y="49">Aplicação front-end (civitas-frontend) – Next.js, React e TypeScript</text><rect fill="#FFFFFF" height="111" rx="7" ry="7" stroke="#85959C" stroke-width="1.55" width="379" x="88" y="73" /><rect fill="#FFFFFF" height="111" rx="7" ry="7" stroke="#85959C" stroke-width="1.55" width="379" x="511" y="73" /><rect fill="#FFFFFF" height="111" rx="7" ry="7" stroke="#85959C" stroke-width="1.55" width="379" x="934" y="73" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="277" y="99">Páginas e layouts</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" x="277" y="123">src/app (App Router)</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" x="277" y="142">login, dashboard</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" x="277" y="161">Client e Server Components</text><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="700" y="99">Componentes reutilizáveis</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" x="700" y="123">src/components, src/features</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" x="700" y="142">Form, Table, Sidebar</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" x="700" y="161">estilização com Tailwind CSS</text><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="1123" y="99">Estado e sessão</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" x="1123" y="123">AuthContext + localStorage</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" x="1123" y="142">Zustand (listagens, navegação)</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" x="1123" y="161">lib/auth-storage.ts</text><rect fill="#FFFFFF" height="52" rx="7" ry="7" stroke="#85959C" stroke-width="1.6" width="940" x="230" y="205" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18.7" font-weight="700" text-anchor="middle" x="700" y="225">Serviços HTTP – src/hooks/generic.ts e especializações</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.9" font-weight="400" text-anchor="middle" x="700" y="245">GenericService&lt;T&gt;; Fetch API, cabeçalho Authorization, tratamento do envelope</text><polyline fill="none" marker-end="url(#arrow)" points="277,184 398,205" stroke="#33454E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" /><polyline fill="none" marker-end="url(#arrow)" points="700,184 700,205" stroke="#33454E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" /><polyline fill="none" marker-end="url(#arrow)" points="1123,184 1002,205" stroke="#33454E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" /><polyline fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)" points="700,273 700,344" stroke="#33454E" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="735" y="302">HTTP + JSON  |  Authorization: Bearer &lt;JWT&gt;</text><text fill="#56646C" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="735" y="322">Envelope Response { code, message, data }</text><rect fill="#ECEEF6" height="496" rx="9" ry="9" stroke="#34444D" stroke-width="2.25" width="1272" x="64" y="344" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="86" y="375">API back-end (civitas-backend) – ASP.NET Core 9 e C#</text><rect fill="#FFFFFF" height="65" rx="7" ry="7" stroke="#85959C" stroke-width="1.6" width="875" x="88" y="398" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18.5" font-weight="700" text-anchor="middle" x="525.5" y="423">Pipeline HTTP – Program.cs</text><text fill="#58656F" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.4" font-weight="400" text-anchor="middle" x="525.5" y="444">UseCors → UseHttpsRedirection → UseAuthentication → UseAuthorization → MapControllers</text><rect fill="#FFFFFF" height="61" rx="7" ry="7" stroke="#85959C" stroke-width="1.6" width="875" x="88" y="479" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18.5" font-weight="700" text-anchor="middle" x="525.5" y="504">Controllers – 15 controladores sob /api</text><text fill="#58656F" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.4" font-weight="400" text-anchor="middle" x="525.5" y="525">rotas, [Authorize]/[AllowAnonymous], códigos HTTP, objeto Response</text><rect fill="#FFFFFF" height="61" rx="7" ry="7" stroke="#85959C" stroke-width="1.6" width="875" x="88" y="557" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18.5" font-weight="700" text-anchor="middle" x="525.5" y="582">Services – GenericService&lt;T, TDto&gt; e especializações</text><text fill="#58656F" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.4" font-weight="400" text-anchor="middle" x="525.5" y="603">regras de negócio, validações, conversão com AutoMapper</text><rect fill="#FFFFFF" height="61" rx="7" ry="7" stroke="#85959C" stroke-width="1.6" width="875" x="88" y="635" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18.5" font-weight="700" text-anchor="middle" x="525.5" y="660">Repositories – GenericRepository&lt;T&gt; e especializações</text><text fill="#58656F" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.4" font-weight="400" text-anchor="middle" x="525.5" y="681">interfaces em Data/Interfaces, consultas, paginação, SaveChanges</text><rect fill="#FFFFFF" height="76" rx="7" ry="7" stroke="#85959C" stroke-width="1.6" width="875" x="88" y="713" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18.5" font-weight="700" text-anchor="middle" x="525.5" y="738">Entity Framework Core – AppDbContext e Builders</text><text fill="#58656F" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.4" font-weight="400" text-anchor="middle" x="525.5" y="762">mapeamento dos Models, provider Npgsql</text><polyline fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)" points="525,464 525,478" stroke="#33454E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" /><polyline fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)" points="525,541 525,556" stroke="#33454E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" /><polyline fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)" points="525,619 525,634" stroke="#33454E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" /><polyline fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)" points="525,697 525,712" stroke="#33454E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" /><rect fill="#FFFFFF" height="167" rx="7" ry="7" stroke="#85959C" stroke-width="1.6" width="267" x="1045" y="398" /><text fill="#24333D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="1179" y="424">Segurança</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" x="1179" y="449">JwtTokenService</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" x="1179" y="470">BCryptPasswordHashService</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" x="1179" y="491">AuthService</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" x="1179" y="512">DevBypassAuthorizationHandler</text><text fill="#5A6670" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" x="1179" y="533">(controlado pela chave DEV)</text><rect fill="#FFFFFF" height="172" rx="7" ry="7" stroke="#85959C" stroke-width="1.6" width="267" x="1045" y="584" /><text fill="#24333D" font-family="Arial, Liberation Sans,